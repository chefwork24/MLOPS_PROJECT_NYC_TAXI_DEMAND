services:

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: nyc_taxi_backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/lightgbm_model.txt
    volumes:
      - ./models:/app/models
    networks:
      - taxi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
  prometheus:
    image: prom/prometheus:latest
    container_name: nyc_taxi_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - taxi_network
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: nyc_taxi_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - taxi_network
    depends_on:
      - prometheus

networks:
  taxi_network:
    driver: bridge

volumes:
  grafana_data: